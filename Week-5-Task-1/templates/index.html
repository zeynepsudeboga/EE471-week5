<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure Speech Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Azure Speech Demo</h1>

    <section id="stt">
      <h2>Speech to Text</h2>

      <label for="stt-language">Language</label>
      <select id="stt-language">
        {% for code, name in languages.items() %}
        <option value="{{ code }}">{{ name }} ({{ code }})</option>
        {% endfor %}
      </select>

      <label for="stt-file">Upload an audio file</label>
      <input type="file" id="stt-file" accept=".wav,.mp3,.m4a,.webm,audio/*">
      <button id="stt-upload">Transcribe file</button>

      <label>…or record from your microphone</label>
      <div class="row">
        <button id="stt-start">Start</button>
        <button id="stt-stop" disabled>Stop</button>
        <button id="stt-send" disabled>Send recording</button>
        <span id="stt-status" class="hint"></span>
      </div>
      <audio id="stt-preview" controls hidden></audio>

      <div id="stt-error" class="error" hidden></div>

      <div id="stt-result" hidden>
        <label for="stt-text">Transcript</label>
        <textarea id="stt-text" rows="6" readonly></textarea>
        <button id="stt-copy">Copy</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
